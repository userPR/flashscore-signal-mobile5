name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android project folders
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/flashsignal/mobile
          mkdir -p app/src/main/assets/dashboard
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp build.gradle app/build.gradle
          cp "build (1).gradle" build.gradle

          cp proguard-rules.pro app/proguard-rules.pro
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cp MainActivity.java app/src/main/java/com/flashsignal/mobile/MainActivity.java
          cp Models.java app/src/main/java/com/flashsignal/mobile/Models.java
          cp MonitorService.java app/src/main/java/com/flashsignal/mobile/MonitorService.java
          cp RuleEngine.java app/src/main/java/com/flashsignal/mobile/RuleEngine.java
          cp StateStore.java app/src/main/java/com/flashsignal/mobile/StateStore.java

          cp app.js app/src/main/assets/dashboard/app.js
          cp index.html app/src/main/assets/dashboard/index.html
          cp style.css app/src/main/assets/dashboard/style.css
          cp detail.js app/src/main/assets/detail.js
          cp monitor.js app/src/main/assets/monitor.js

          cp icon_app.xml app/src/main/res/drawable/icon_app.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml

          echo "=== Rebuilt project tree ==="
          find app -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-signal-mobile-v0.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
